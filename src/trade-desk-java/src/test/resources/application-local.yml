# H2 profile for tests and local runs: mvn spring-boot:test-run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:cbsa;MODE=DB2;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS IBMUSER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: IBMUSER
  sql:
    init:
      mode: always
      data-locations: classpath:local-seed.sql
