spring:
  application:
    name: trade-desk-java
  datasource:
    url: ${BANK_DB_URL:jdbc:db2://localhost:50000/CBSA}
    username: ${BANK_DB_USER:}
    password: ${BANK_DB_PASSWORD:}
    driver-class-name: com.ibm.db2.jcc.DB2Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${BANK_DB_SCHEMA:IBMUSER}

# Replaces SORTCODE.cpy (77 SORTCODE PIC 9(6) VALUE 987654).
dbcrfun:
  sortcode: ${BANK_SORTCODE:987654}
