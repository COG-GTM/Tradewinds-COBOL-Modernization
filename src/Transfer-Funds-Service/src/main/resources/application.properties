spring.application.name=transferfunds

# XFRFUN forces both sort codes to the bank's own SORTCODE constant (987654).
cbsa.bank.sort-code=987654

# In-memory H2 stands in for the Db2 ACCOUNT and PROCTRAN tables so the
# modernized service is runnable and testable without a mainframe.
spring.datasource.url=jdbc:h2:mem:cbsa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
