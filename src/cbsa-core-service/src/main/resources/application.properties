spring.application.name=cbsa-core-service
server.port=${PORT:8080}
server.servlet.context-path=/webui-1.0

# Default profile: H2 in-memory, PostgreSQL compatibility mode so SQL is portable.
spring.datasource.url=jdbc:h2:mem:cbsa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

management.endpoints.web.exposure.include=health,info

# Bank identity (GETSCODE / GETCOMPY)
cbsa.sortcode=987654
cbsa.company-name=CICS Bank Sample Application

# Seed data (baseline/seed/seed.sql). Comma-separated; the first location that exists is loaded.
# mode: if-empty (default; skips when CUSTOMER or ACCOUNT already has rows) | always | never
cbsa.seed.location=file:../../baseline/seed/seed.sql,classpath:seed/seed.sql
cbsa.seed.mode=if-empty

# Deterministic time / randomness (blank = system clock / unseeded).
# cbsa.clock.fixed=2026-01-15T10:30:00Z
cbsa.clock.fixed=
cbsa.clock.zone=UTC
# cbsa.random.seed=12345
cbsa.random.seed=

# Credit agencies (CRDTAGY1-5): honour the legacy random delay only when true.
cbsa.credit.simulate-delay=false
# CRDTAGY1-5 / CRECUST review-date randomness when cbsa.random.seed is set:
# legacy (default) = java.util.Random(seed + EIBTASKN [+ agency]) as the legacy harness does (matches transcripts)
# cbsa-lcg         = CbsaRandomFactory streams (seed + agency), independent of the task number
cbsa.credit.random-algorithm=legacy

# BANKDATA REST trigger (dev only): disabled unless enabled and a token is configured.
cbsa.bankdata.endpoint.enabled=false
cbsa.bankdata.endpoint.token=
cbsa.bankdata.endpoint.max-customers=10000
